name: update-news
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - run: python pipeline.py
        env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add docs/events.json && (git diff --staged --quiet || git commit -m "update events" && git push)
